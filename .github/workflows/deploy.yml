name: Deploy GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./guiaPracticaSemana05
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guiaPracticaSemana05/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Compilar
        run: npx vite build --base=/${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: './guiaPracticaSemana05/dist'

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
